aid: absurd
name: Absurd
description: >-
  Absurd is an AI video creation platform positioning itself as "the Creative OS for AI
  video." It uses autonomous AI agents to handle scripting, scene planning, and video
  generation, letting companies produce brand and performance advertisements at scale in
  roughly 72 hours instead of weeks. Based in Los Angeles and part of Y Combinator's Fall
  2025 batch, Absurd works with brands such as Hims, Kalshi, Replit, and Brex, with some of
  its generated videos reaching over a million organic views. As of this profile the company
  markets a product surface only (portfolio, careers, and contact pages) and does not publish
  a public API, developer documentation, or SDKs; this entry was enriched from public web
  sources and will be upgraded if a developer surface appears.
