aid: absurd
name: Absurd
description: >-
  Absurd is an AI video creation platform positioning itself as "the Creative OS for AI
  video." It uses autonomous AI agents to handle scripting, scene planning, and video
  generation, letting companies produce brand and performance advertisements at scale in
  roughly 72 hours instead of weeks. Based in Los Angeles and part of Y Combinator's Fall
  2025 batch, Absurd works with brands such as Hims, Kalshi, Replit, Brex, Whop, and Reforge,
  with some of its generated videos reaching over a million organic views. The company runs a
  managed, sales-led production motion rather than a self-serve platform: its published
  sitemap declares exactly four routes (home, portfolio, careers, contact), and it ships no
  pricing page, no blog, no developer portal, no documentation, no SDKs, and no GitHub
  organization. Three Absurd-controlled hosts are live but none is a developer surface —
  app.absurd.com is the gated customer application, api.absurd.com is its private FastAPI
  backend with schema and docs routes disabled, and lp.absurd.com is a key-gated Supabase
  project serving the landing page. This entry was enriched from public web sources and live
  unauthenticated probes, and will be upgraded if a developer surface appears.
